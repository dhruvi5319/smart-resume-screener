spring.application.name=smartresumescreener-backend
logging.level.org.springframework.security=DEBUG

# --------------------------------------------
# ✅ Database Configuration
# --------------------------------------------
# Secrets come from environment variables (set in Render / your local shell).
# Never hardcode credentials here — this file is committed to git.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --------------------------------------------
# ✅ JPA / Hibernate Config
# --------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --------------------------------------------
# ✅ Server Port (Optional)
# --------------------------------------------
server.port=8080

# --------------------------------------------
# ✅ JWT Configuration (you will use these in SecurityConfig)
# --------------------------------------------
app.jwt.secret=${APP_JWT_SECRET}
# 1 day in milliseconds
app.jwt.expiration=3600000

# --------------------------------------------
# ✅ AI service (FastAPI on Hugging Face Spaces)
# --------------------------------------------
ai.model.url=${AI_MODEL_URL:http://localhost:8000}

# --------------------------------------------
# ✅ File Upload (Optional - for resume handling)
# --------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# --------------------------------------------
# ✅ CORS Settings (Optional - handle React frontend on another port)
# --------------------------------------------
# You can manage this in @CrossOrigin too, but here's global setting
# Add a WebMvcConfigurer if needed
